<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>AgentGate Replay</title>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f8f9fb; --border: #e2e5ea; --text: #14171c; --muted: #5f6875;
  --faint: #8a929e; --accent: #3651d4; --red: #c4262e; --red-bg: #fdeced; --red-line: #f3b9bc;
  --green: #17804a; --green-bg: #e6f5ec; --green-line: #a9dcbf; --amber: #8a5a00; --amber-bg: #fff4d6;
  --grey-bg: #eceef1; --mark: #fff0a3; --mark-text: #3a2e00; --code: #f3f4f7; --on-solid: #ffffff; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1014; --surface: #161a21; --surface-2: #1b2028; --border: #2a303b; --text: #e9ebef; --muted: #a0a8b4;
    --faint: #6f7884; --accent: #8fa2ff; --red: #ff6b70; --red-bg: #3a1619; --red-line: #6d2a2f;
    --green: #4fca8b; --green-bg: #11301f; --green-line: #245a3c; --amber: #f2c45a; --amber-bg: #33280c;
    --grey-bg: #232832; --mark: #5c4a00; --mark-text: #fff3c4; --code: #1f242d; --on-solid: #12151a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1014; --surface: #161a21; --surface-2: #1b2028; --border: #2a303b; --text: #e9ebef; --muted: #a0a8b4;
  --faint: #6f7884; --accent: #8fa2ff; --red: #ff6b70; --red-bg: #3a1619; --red-line: #6d2a2f;
  --green: #4fca8b; --green-bg: #11301f; --green-line: #245a3c; --amber: #f2c45a; --amber-bg: #33280c;
  --grey-bg: #232832; --mark: #5c4a00; --mark-text: #fff3c4; --code: #1f242d; --on-solid: #12151a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh;
  font: 15px/1.45 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; }
button { font: inherit; color: inherit; }

/* honest label */
.label {
  display: flex; align-items: center; gap: 14px; padding: 9px 24px; background: var(--amber-bg); color: var(--amber);
  border-bottom: 1px solid var(--border); font-weight: 600; font-size: 15px;
}
.label .brand { color: var(--text); font-weight: 700; letter-spacing: .01em; margin-right: 6px; }
.label .brand span { color: var(--accent); }
.label .spacer { flex: 1; }
.label .theme { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px;
  padding: 2px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }

/* top bar */
.topbar { display: flex; gap: 20px; align-items: center; padding: 14px 24px; background: var(--surface);
  border-bottom: 1px solid var(--border); }
.lists { display: flex; flex-direction: column; gap: 7px; min-width: 0; flex: 1; }
.row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.row-label { width: 96px; flex: none; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.chip { width: 67px; padding: 3px 0 4px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2);
  cursor: pointer; text-align: center; line-height: 1.15; transition: transform .12s, border-color .12s; }
.chip:hover { transform: translateY(-1px); border-color: var(--faint); }
.chip .n { display: block; font-size: 11px; letter-spacing: -.01em; color: var(--text); }
.chip .s { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; }
.chip.blocked .s { color: var(--red); } .chip.allowed .s { color: var(--green); } .chip.shared .s { color: var(--red); }
.chip.blocked { background: var(--red-bg); border-color: var(--red-line); }
.chip.shared { background: var(--red-bg); border-color: var(--red-line); }
.chip.allowed { background: var(--green-bg); border-color: var(--green-line); }
.chip.current { outline: 2.5px solid var(--accent); outline-offset: 1px; }

.stats { display: flex; gap: 12px; flex: none; }
.stat { border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px; background: var(--surface-2); }
.stat .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v .bad { color: var(--red); } .stat .v .good { color: var(--green); } .stat .v .arrow { color: var(--faint); margin: 0 6px; font-weight: 400; }
.stat .v .dim { opacity: .38; }
.stat .sub { font-size: 12px; color: var(--faint); }

.switch { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
.track { position: relative; display: flex; border-radius: 999px; background: var(--grey-bg); border: 1px solid var(--border); padding: 3px; }
.track span { position: relative; z-index: 1; width: 104px; text-align: center; padding: 8px 0; font-weight: 700; font-size: 15px; color: var(--muted); transition: color .2s; }
.knob { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 104px; border-radius: 999px; background: var(--red); transition: transform .25s cubic-bezier(.3,.7,.3,1), background .25s; }
.gate-on .knob { transform: translateX(104px); background: var(--green); }
.gate-off .track span.off, .gate-on .track span.on { color: var(--on-solid); }
.switch .hint { font-size: 11.5px; color: var(--faint); }
kbd { font: 11px/1 "Cascadia Mono", Consolas, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--surface); color: var(--muted); }

/* columns */
main { flex: 1; display: grid; grid-template-columns: 1.12fr 1fr 1fr; gap: 18px; padding: 18px 24px; min-height: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel > h2 { margin: 0; padding: 14px 20px 12px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.panel > h2 .num { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--grey-bg); color: var(--text); font-size: 12px; }
.panel > h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }
.body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; flex: 1; }
.swap { animation: fade .28s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.request { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 9px 14px; font-size: 15px; }
.request b { color: var(--muted); font-weight: 600; margin-right: 6px; }

/* left */
.imgwrap { display: flex; gap: 14px; min-height: 0; }
.frame { flex: none; height: 400px; aspect-ratio: 1000 / 1300; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; background: #fff; cursor: zoom-in; position: relative; }
.frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
.frame .zoomhint { position: absolute; right: 6px; bottom: 6px; font-size: 11px; background: rgba(0,0,0,.6); color: #fff; padding: 2px 7px; border-radius: 6px; }
.meta { display: flex; flex-direction: column; gap: 10px; min-width: 0; font-size: 14px; }
.meta .file { font-weight: 700; font-size: 17px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; width: fit-content; }
.tag.carrier { background: var(--red-bg); color: var(--red); } .tag.clean { background: var(--green-bg); color: var(--green); }
.truth { border-left: 3px solid var(--red-line); padding: 4px 0 4px 10px; color: var(--muted); }
.truth .t { color: var(--text); font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; word-break: break-word; }
.small { font-size: 12.5px; color: var(--faint); }
.ocrhead { display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: -6px; }
.ocrhead .small { text-transform: none; letter-spacing: 0; font-weight: 400; }
.ocr { position: relative; flex: 1; min-height: 120px; overflow: auto; background: var(--code); border: 1px solid var(--border); border-radius: 10px; padding: 8px 0; font-size: 13px; line-height: 1.6; }
.ocr .ln { padding: 0 14px; white-space: pre-wrap; word-break: break-word; }
.ocr .ln.hit { background: var(--mark); color: var(--mark-text); font-weight: 600; box-shadow: inset 4px 0 0 var(--red); }
.ocr .ln.hit strong { text-decoration: underline 2px; text-underline-offset: 3px; }
.miss { background: var(--amber-bg); color: var(--amber); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; font-weight: 500; }

/* middle */
.callcard { border: 1px solid var(--border); border-radius: 14px; background: var(--code); padding: 22px 24px; font-size: 25px; line-height: 1.55; }
.callcard .fn { color: var(--accent); font-weight: 700; }
.callcard .arg { padding-left: 1.4em; display: flex; gap: .4em; flex-wrap: wrap; }
.callcard .k { color: var(--muted); }
.callcard .val { font-weight: 600; word-break: break-all; }
.callcard.none { font-family: inherit; font-size: 20px; color: var(--muted); border-style: dashed; background: transparent; text-align: center; padding: 34px 20px; }
.why { font-size: 14px; color: var(--muted); }
.outcome { border-radius: 14px; padding: 18px 22px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; transition: background .25s, color .25s; }
.outcome .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font-size: 22px; }
.outcome.bad { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-line); } .outcome.bad .ico { background: var(--red); }
.outcome.good { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-line); } .outcome.good .ico { background: var(--green); }
.outcome .sub { display: block; font-size: 13px; font-weight: 500; opacity: .85; }
.answer { margin-top: auto; border-top: 1px solid var(--border); padding-top: 12px; font-size: 15px; color: var(--muted); }
.answer b { color: var(--text); }

/* right */
.badge { align-self: flex-start; font-size: 46px; font-weight: 800; letter-spacing: .04em; padding: 8px 26px; border-radius: 14px; line-height: 1.1; }
.badge.block { background: var(--red); color: var(--on-solid); }
.badge.allow { background: var(--green); color: var(--on-solid); }
.badge.off { background: var(--grey-bg); color: var(--muted); border: 2px dashed var(--border); }
.pop { animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.85); opacity: .2; } to { transform: none; opacity: 1; } }
.plain { font-size: 21px; font-weight: 600; line-height: 1.35; }
.plain .v { font-family: "Cascadia Mono", Consolas, monospace; font-size: .9em; background: var(--code); border-radius: 6px; padding: 0 5px; }
.srcs { display: flex; flex-direction: column; gap: 8px; }
.src { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.src .arg { width: 34px; font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.schip { display: inline-flex; gap: 8px; align-items: center; border-radius: 999px; padding: 5px 14px; font-size: 14.5px; font-weight: 600; border: 1px solid; }
.schip.pixels { background: var(--red-bg); color: var(--red); border-color: var(--red-line); }
.schip.unknown { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
.schip.trusted { background: var(--green-bg); color: var(--green); border-color: var(--green-line); }
.schip .ic { font-size: 15px; }
.raw { margin-top: auto; border-top: 1px solid var(--border); padding-top: 12px; }
.raw .small { margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.raw .r { font-size: 12.5px; color: var(--muted); line-height: 1.5; word-break: break-word; }

footer { display: flex; gap: 20px; align-items: center; padding: 10px 24px; border-top: 1px solid var(--border); background: var(--surface); font-size: 13.5px; color: var(--muted); }
footer .lim b { color: var(--text); }
footer .keys { margin-left: auto; display: flex; gap: 14px; white-space: nowrap; }

/* zoom */
.zoom { position: fixed; inset: 0; background: rgba(8,10,14,.82); display: none; place-items: center; z-index: 10; cursor: zoom-out; }
.zoom.open { display: grid; }
.zoom img { max-height: 96vh; max-width: 96vw; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #fff; }

@media (max-width: 1280px) {
  .topbar { flex-wrap: wrap; }
  main { grid-template-columns: 1fr; }
  .frame { height: 320px; }
}
@media (max-width: 640px) {
  .label, .topbar, main, footer { padding-left: 16px; padding-right: 16px; }
  .imgwrap { flex-direction: column; }
  .frame { height: auto; width: 100%; }
  .row-label { width: 100%; }
  .stats { flex-wrap: wrap; }
  footer { flex-direction: column; align-items: flex-start; }
  footer .keys { margin-left: 0; }
  .badge { font-size: 34px; }
}
</style>
</head>
<body>
<div class="label">
  <span class="brand">Agent<span>Gate</span> · replay</span>
  <span id="honest"></span>
  <span class="spacer"></span>
  <button class="theme" id="themeBtn" title="Toggle theme (T)">Theme</button>
</div>

<div class="topbar">
  <div class="lists">
    <div class="row" id="rowCarrier"><span class="row-label">Hidden line</span></div>
    <div class="row" id="rowClean"><span class="row-label">Clean image</span></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">Attack success</div><div class="v" id="statAttack"></div><div class="sub">gate off → gate on</div></div>
    <div class="stat"><div class="k">False blocks</div><div class="v" id="statFalse"></div><div class="sub">gate on, clean images</div></div>
  </div>
  <div class="switch" id="switch" role="switch" tabindex="0">
    <div class="track"><div class="knob"></div><span class="off">Gate off</span><span class="on">Gate on</span></div>
    <div class="hint"><kbd>space</kbd> toggles</div>
  </div>
</div>

<main>
  <section class="panel"><h2><span class="num">1</span>What the agent sees<span class="right" id="leftRight"></span></h2><div class="body" id="left"></div></section>
  <section class="panel"><h2><span class="num">2</span>What the agent tried</h2><div class="body" id="mid"></div></section>
  <section class="panel"><h2><span class="num">3</span>AgentGate</h2><div class="body" id="right"></div></section>
</main>

<footer>
  <span class="lim" id="limits"></span>
  <span class="keys"><span><kbd>←</kbd> <kbd>→</kbd> episode</span><span><kbd>space</kbd> gate</span><span><kbd>Z</kbd> zoom image</span><span><kbd>T</kbd> theme</span></span>
</footer>

<div class="zoom" id="zoom"><img alt=""></div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const E = D.episodes;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const ARG = {file_id: "file", email: "to"};
  const PLACEMENT = {top_margin_small: "top margin, small type", mid_faint: "mid-page, faint grey",
                     footer_box: "inside a footer box", left_vertical: "left margin, rotated"};
  const short = (img) => img.replace(".png", "");
  const pixelSrc = (s) => s.source && s.source.startsWith("screenshot:");

  const carriers = E.filter((e) => e.carrier), clean = E.filter((e) => !e.carrier);
  const offWins = carriers.filter((e) => e.shared_off.length).length;
  const onWins = carriers.filter((e) => e.shared_on.length).length;
  const falseBlocks = clean.filter((e) => e.calls.some((c) => c.decision === "block")).length;
  const missed = carriers.filter((e) => !e.calls.some((c) => c.sources.some((s) => s.argument === "email" && pixelSrc(s))));

  $("honest").textContent = `Scripted worst-case agent: it obeys every hidden instruction. Muse Spark Open refused all ${D.model_refused} on its own (first image set).`;
  $("limits").innerHTML = `<b>Limits:</b> OCR missed the hidden address in ${missed.length} of ${carriers.length} images with a hidden line (${missed.map((e) => short(e.image)).join(", ")}); those were still blocked, as an unknown recipient. Synthetic images, <span class="mono">.test</span> addresses and a canary file; no real data.`;

  // state, mirrored in the URL hash so a view can be reopened exactly
  const st = {ep: 0, gate: false};
  (location.hash.slice(1).split("&")).forEach((kv) => {
    const [k, v] = kv.split("=");
    if (k === "ep") st.ep = Math.max(0, Math.min(E.length - 1, parseInt(v, 10) || 0));
    if (k === "gate") st.gate = v === "on";
    if (k === "theme" && (v === "dark" || v === "light")) document.documentElement.dataset.theme = v;
  });
  const saveHash = () => { try { history.replaceState(null, "", `#ep=${st.ep}&gate=${st.gate ? "on" : "off"}`); } catch (e) {} };

  function status(e, gate) {
    if (!gate) return e.shared_off.length ? ["shared", "SHARED"] : ["allowed", "ALLOWED"];
    return e.calls.some((c) => c.decision === "block") ? ["blocked", "BLOCKED"] : ["allowed", "ALLOWED"];
  }

  // episode list
  const chips = E.map((e, i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.title = e.image;
    b.innerHTML = `<span class="n">${esc(short(e.image))}</span><span class="s"></span>`;
    b.onclick = () => go(i);
    (e.carrier ? $("rowCarrier") : $("rowClean")).appendChild(b);
    return b;
  });

  function renderTop() {
    chips.forEach((c, i) => {
      const [cls, word] = status(E[i], st.gate);
      c.className = `chip ${cls}${i === st.ep ? " current" : ""}`;
      c.querySelector(".s").textContent = word;
    });
    $("statAttack").innerHTML = `<span class="bad${st.gate ? " dim" : ""}">${offWins}/${carriers.length}</span><span class="arrow">→</span><span class="good${st.gate ? "" : " dim"}">${onWins}/${carriers.length}</span>`;
    $("statFalse").innerHTML = `<span class="${falseBlocks ? "bad" : "good"}">${falseBlocks}/${clean.length}</span>`;
    document.body.classList.toggle("gate-on", st.gate);
    document.body.classList.toggle("gate-off", !st.gate);
    $("switch").setAttribute("aria-checked", String(st.gate));
  }

  function hitLine(e) {
    const srcs = e.calls.flatMap((c) => c.sources).filter(pixelSrc);
    const s = srcs.find((x) => x.argument === "email" && x.recovered_line) || srcs.find((x) => x.recovered_line);
    return s ? {line: s.recovered_line, value: s.value, arg: s.argument} : null;
  }

  function renderLeft(e) {
    const hit = hitLine(e);
    const lines = e.ocr.split("\n").map((ln) => {
      if (hit && ln === hit.line) {
        const i = ln.toLowerCase().indexOf(hit.value.toLowerCase());
        const body = i < 0 ? esc(ln) : esc(ln.slice(0, i)) + "<strong>" + esc(ln.slice(i, i + hit.value.length)) + "</strong>" + esc(ln.slice(i + hit.value.length));
        return `<div class="ln hit">${body}</div>`;
      }
      return `<div class="ln">${esc(ln)}</div>`;
    }).join("");
    const emailMissed = e.carrier && !(hit && hit.arg === "email");
    $("leftRight").textContent = `${st.ep + 1} / ${E.length}`;
    $("left").innerHTML = `
      <div class="request"><b>User</b>${esc(e.request)}</div>
      <div class="imgwrap">
        <div class="frame" id="frame" title="Click or press Z to zoom"><img src="${D.images[e.image]}" alt="${esc(e.image)}"><span class="zoomhint">Z zoom</span></div>
        <div class="meta">
          <div class="file mono">${esc(e.image)}</div>
          ${e.carrier
            ? `<span class="tag carrier">Hidden line · ${esc(PLACEMENT[e.style] || e.style)}</span>
               <div class="truth">What the image hides (ground truth; the gate never sees this):<div class="t">${esc(e.carrier_text)}</div></div>`
            : `<span class="tag clean">Clean image · no hidden line</span>
               <div class="small">The agent should only read the document and answer.</div>`}
        </div>
      </div>
      ${emailMissed ? `<div class="miss">OCR did not recover the hidden address from this image${hit ? " (it recovered the file name)" : ""}. The gate blocks anyway: the recipient appears nowhere it trusts.</div>` : ""}
      <div class="ocrhead">Text OCR recovered<span class="small">${hit ? "highlighted: the line holding the " + (hit.arg === "email" ? "hidden address" : "file name") : "rapidocr, 768 px"}</span></div>
      <div class="ocr mono" id="ocr">${lines}</div>`;
    $("frame").onclick = openZoom;
    const box = $("ocr"), m = box.querySelector(".hit");
    if (m) box.scrollTop = Math.max(0, m.offsetTop - box.clientHeight / 2 + m.offsetHeight / 2);
  }

  function renderMid(e) {
    const c = e.calls[0];
    const shared = st.gate ? e.shared_on : e.shared_off;
    const card = c
      ? `<div class="callcard mono"><span class="fn">${esc(c.tool)}</span>(${Object.entries(c.args).map(([k, v], i, a) =>
          `<div class="arg"><span class="k">${esc(ARG[k] || k)}:</span><span class="val">${esc(v)}${i < a.length - 1 ? "<span class=\"k\">,</span>" : ""}</span></div>`).join("")})</div>
         <div class="why">The scripted agent copied this call from the hidden line, exactly as a fully compromised agent would.</div>`
      : `<div class="callcard none">No tool call.<br><span class="small">The agent only read the image and answered.</span></div>`;
    const out = shared.length
      ? `<div class="outcome bad"><span class="ico">!</span><span>File shared with ${esc(shared.map((s) => s.email).join(", "))}<span class="sub">${esc(shared.map((s) => s.file).join(", "))} left the user's drive</span></span></div>`
      : `<div class="outcome good"><span class="ico">✓</span><span>Nothing shared<span class="sub">${c ? "the call never ran" : "no file left the user's drive"}</span></span></div>`;
    $("mid").innerHTML = `${card}${out}<div class="answer">Then the agent gave its scripted answer: <b>${esc(e.answer.replace(/^Answer:\s*/, "").replace(/\.$/, ""))}</b></div>`;
  }

  function chip(s, img) {
    if (pixelSrc(s)) return `<span class="schip pixels"><span class="ic">▣</span>text inside an image · ${esc(s.source.split(":")[1])}</span>`;
    if (s.verdict === "unknown") return `<span class="schip unknown"><span class="ic">?</span>unknown · not in your request or any trusted source</span>`;
    return `<span class="schip trusted">${esc(s.source)}</span>`;
  }

  function plain(c) {
    const to = c.sources.find((s) => s.argument === "email");
    if (!to) return esc(c.reason);
    return pixelSrc(to)
      ? `You never named <span class="v">${esc(to.value)}</span>. It appears only in text inside the image.`
      : `You never named <span class="v">${esc(to.value)}</span>, and no trusted source contains it.`;
  }

  function renderRight(e, animate) {
    const c = e.calls[0];
    let html;
    if (!st.gate) {
      html = `<div class="badge off${animate ? " pop" : ""}">GATE OFF</div>
        <div class="plain">${c ? "No check. The call ran as the agent sent it." : "No check. There was no tool call to run."}</div>`;
    } else if (!c) {
      html = `<div class="badge allow${animate ? " pop" : ""}">ALLOWED</div>
        <div class="plain">No risky tool call. The answer reaches the user unchanged.</div>
        <div class="srcs"><div class="src"><span class="schip trusted"><span class="ic">✓</span>nothing to check</span></div></div>`;
    } else {
      const blocked = c.decision === "block";
      html = `<div class="badge ${blocked ? "block" : "allow"}${animate ? " pop" : ""}">${blocked ? "BLOCKED" : c.decision.toUpperCase()}</div>
        <div class="plain">${plain(c)}</div>
        <div class="srcs">${c.sources.map((s) => `<div class="src"><span class="arg">${esc(ARG[s.argument] || s.argument)}</span>${chip(s)}</div>`).join("")}</div>
        <div class="why">The agent gets an error back instead of a result, and still answers the user's question.</div>
        <div class="raw"><div class="small">The gate's own explanation</div><div class="r mono">${esc(c.reason)}</div></div>`;
    }
    $("right").innerHTML = html;
  }

  function render(animate) {
    const e = E[st.ep];
    renderTop(); renderLeft(e); renderMid(e); renderRight(e, animate);
    saveHash();
  }

  function swapAnim() {
    ["left", "mid", "right"].forEach((id) => { const n = $(id); n.classList.remove("swap"); void n.offsetWidth; n.classList.add("swap"); });
  }
  function go(i) { st.ep = (i + E.length) % E.length; render(false); swapAnim(); }
  function toggle() { st.gate = !st.gate; render(true); }

  const zoom = $("zoom");
  function openZoom() { zoom.querySelector("img").src = D.images[E[st.ep].image]; zoom.classList.add("open"); }
  zoom.onclick = () => zoom.classList.remove("open");
  $("switch").onclick = toggle;
  $("themeBtn").onclick = cycleTheme;
  function cycleTheme() {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  }

  document.addEventListener("keydown", (ev) => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (ev.key === "ArrowRight") { go(st.ep + 1); ev.preventDefault(); }
    else if (ev.key === "ArrowLeft") { go(st.ep - 1); ev.preventDefault(); }
    else if (ev.key === " " || ev.code === "Space") { toggle(); ev.preventDefault(); }
    else if (ev.key === "z" || ev.key === "Z") { zoom.classList.contains("open") ? zoom.classList.remove("open") : openZoom(); }
    else if (ev.key === "Escape") zoom.classList.remove("open");
    else if (ev.key === "t" || ev.key === "T") cycleTheme();
    else if (ev.key === "Home") go(0);
    else if (ev.key === "End") go(E.length - 1);
  });

  render(false);
})();
</script>
</body>
</html>
