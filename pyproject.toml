[build-system]
requires = ["setuptools>=77"]   # needed for an SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
dynamic = ["version"]
description = "A deterministic action gate with provenance, including provenance through pixels."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []   # the gate, session and policies use only the standard library

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime==1.4.4", "pillow>=10.1", "numpy"]   # agentgate/pixels.py
mcp = ["mcp>=2.3,<3", "agentdojo==0.1.35"]                       # agentgate/mcp_server.py imports the adapter's gate_message
agentdojo = ["agentdojo==0.1.35"]                                # agentgate/adapters/agentdojo_adapter.py
detector = ["torch", "transformers", "python-dotenv"]            # agentgate/detectors.py
judge = ["httpx"]                                                # agentgate/judge.py, needs the proxy from a clone
synth = ["httpx", "jsonschema"]                                  # agentgate/policy_synth.py

[project.urls]
Repository = "https://github.com/mathesh310703/agentgate"

[tool.setuptools.packages.find]
include = ["agentgate*"]

[tool.setuptools.dynamic]
version = { attr = "agentgate.__version__" }
